name: Deploy ECLIPSE Dev Platform

on:
  push:
    branches:
      - main
      - claude/eclipse-dev-platform-a6kogw
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Secret prüfen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Das Repository-Secret CLOUDFLARE_API_TOKEN fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Wrangler installieren
        run: npm install --no-save wrangler@4

      - name: Seite bauen
        run: node scripts/build.mjs

      - name: D1-Datenbank sicherstellen
        run: |
          find_db() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const i = s.indexOf("["); if (i < 0) return;
                const db = JSON.parse(s.slice(i)).find(x => x.name === "eclipse-db");
                if (db) process.stdout.write(db.uuid || db.id || "");
              });'
          }
          DB_ID="$(find_db)"
          if [ -z "$DB_ID" ]; then
            echo "Lege D1-Datenbank eclipse-db an …"
            npx wrangler d1 create eclipse-db
            DB_ID="$(find_db)"
          fi
          if [ -z "$DB_ID" ]; then echo "::error::D1-Datenbank konnte nicht gefunden oder angelegt werden. Hat der Token das Recht D1: Edit?"; exit 1; fi
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/" wrangler.toml
          echo "D1-Datenbank: $DB_ID"

      - name: workers.dev-Subdomain sicherstellen
        env:
          WANTED_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN || 'dinnerboneagg' }}
        run: |
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$ACC" ]; then
            ACC="$(curl -fsS -H "$AUTH" "$API/accounts?per_page=5" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result||[];process.stdout.write(r[0]?r[0].id:"")})')"
          fi
          if [ -z "$ACC" ]; then echo "::error::Cloudflare-Konto nicht gefunden. Lege das Secret CLOUDFLARE_ACCOUNT_ID an."; exit 1; fi
          CUR="$(curl -sS -H "$AUTH" "$API/accounts/$ACC/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write((j.result&&j.result.subdomain)||"")}catch{}})')"
          put_sub() {
            curl -sS -X PUT -H "$AUTH" -H 'Content-Type: application/json' --data "{\"subdomain\":\"$1\"}" "$API/accounts/$ACC/workers/subdomain"
          }
          echo "Aktuelle Subdomain: ${CUR:-keine} · gewünscht: $WANTED_SUBDOMAIN"
          if [ -n "$CUR" ] && [ "$CUR" != "$WANTED_SUBDOMAIN" ]; then
            OLD="$CUR"
            RES="$(curl -sS -X DELETE -H "$AUTH" "$API/accounts/$ACC/workers/subdomain")"
            if echo "$RES" | grep -Eq '"success": *true'; then
              echo "Alte Subdomain $OLD entfernt."; CUR=""
            else
              echo "$RES" | head -c 400; echo
              echo "::warning::Die alte Subdomain $OLD konnte nicht entfernt werden. Die Seite bleibt unter der alten Adresse erreichbar."
            fi
          fi
          if [ -z "$CUR" ]; then
            RES="$(put_sub "$WANTED_SUBDOMAIN")"
            if echo "$RES" | grep -Eq '"success": *true'; then
              CUR="$WANTED_SUBDOMAIN"; echo "Neue Subdomain: $CUR.workers.dev"
            else
              echo "$RES" | head -c 400; echo
              if [ -n "${OLD:-}" ] && echo "$(put_sub "$OLD")" | grep -Eq '"success": *true'; then
                CUR="$OLD"; echo "::warning::$WANTED_SUBDOMAIN ist nicht verfügbar. Die alte Subdomain $OLD wurde wiederhergestellt."
              else
                echo "::error::Die Subdomain $WANTED_SUBDOMAIN konnte nicht angelegt werden (vielleicht schon vergeben)."; exit 1
              fi
            fi
          fi
          echo "SUBDOMAIN=$CUR" >> "$GITHUB_ENV"
          echo "CF_ACC=$ACC" >> "$GITHUB_ENV"

      - name: Worker veröffentlichen
        run: |
          npx wrangler deploy
          echo "::notice title=Adresse::https://eclipse.$SUBDOMAIN.workers.dev"
          echo "### Online: https://eclipse.$SUBDOMAIN.workers.dev" >> "$GITHUB_STEP_SUMMARY"

      - name: Team-Schlüssel entfernen (Seite ohne Passwort)
        run: |
          # Der Zugang ist bewusst offen: Wer den Link kennt, kann die Plattform nutzen.
          RES="$(curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/scripts/eclipse/secrets/TEAM_KEY")"
          if echo "$RES" | grep -Eq '"success": *true'; then echo "Team-Schlüssel entfernt."; else echo "Kein Team-Schlüssel vorhanden (oder bereits entfernt)."; fi
