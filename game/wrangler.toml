name = "spiel"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"

# Ein gemeinsamer Spielraum für alle Spieler (Echtzeit über WebSocket).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
