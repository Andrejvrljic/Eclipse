name = "spiel"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"

# Ein gemeinsamer Spielraum für alle Spieler (Echtzeit über WebSocket).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Dieselbe Datenbank wie das Dashboard: Einstellungen, Spielstände und Befehle werden geteilt.
[[d1_databases]]
binding = "DB"
database_name = "eclipse-db"
database_id = "__D1_DATABASE_ID__"
